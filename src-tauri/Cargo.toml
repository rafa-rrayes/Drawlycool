[package]
name = "drawlycool"
version = "1.0.0"
description = "Drawlycool: hand-drawn whiteboard with local canvases and live collaboration"
authors = ["Rafa <rafa@rayes.com.br>"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "drawlycool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
tauri-plugin-dialog = "=2.8.1"
tauri-plugin-window-state = "=2.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
drawlycool-server = { path = "../server" }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
if-addrs = "0.15.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls", "http2"] }
tokio = { version = "1.53", features = ["sync", "time", "macros"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
panic = "abort"
