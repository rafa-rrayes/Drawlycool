<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drawlycool</title>
    <script>
      // Serve Excalidraw's fonts from our own bundle instead of a CDN.
      window.EXCALIDRAW_ASSET_PATH = "/";
      // Repaint the canvas at most once per frame (as excalidraw.com does),
      // instead of once per wheel/pinch event while zooming or panning.
      window.EXCALIDRAW_THROTTLE_RENDER = true;
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
